server:
  port: 9090

spring:
  application:
    name: platform-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PLATFORM_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/service_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PLATFORM_DATASOURCE_USERNAME:root}
    password: ${PLATFORM_DATASOURCE_PASSWORD:admin}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: platform_flyway_history
    baseline-on-migrate: true
    baseline-version: 0

platform:
  registry-file: ${PLATFORM_REGISTRY_FILE:../../../registry/applications.yml}
  security:
    jwt-secret: ${PLATFORM_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    token-ttl: ${PLATFORM_TOKEN_TTL:8h}
    bootstrap-admin:
      username: ${PLATFORM_ADMIN_USERNAME:admin}
      password: ${PLATFORM_ADMIN_PASSWORD:admin123456}
      display-name: ${PLATFORM_ADMIN_DISPLAY_NAME:平台管理员}
