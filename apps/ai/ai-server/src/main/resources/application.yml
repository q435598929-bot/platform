server:
  port: ${AI_SERVER_PORT:8081}

spring:
  application:
    name: ai-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PLATFORM_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/service_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PLATFORM_DATASOURCE_USERNAME:root}
    password: ${PLATFORM_DATASOURCE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: ai_flyway_history
    baseline-on-migrate: true
    baseline-version: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors-allowed-origin: ${AI_CORS_ALLOWED_ORIGIN:http://localhost:5175}
  # 本地开发密钥（Base64 编码的 32 字节）；正式使用前请替换此值。
  encryption-key: ${AI_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  ai:
    connect-timeout: 5s
    read-timeout: 120s
    proxy:
      enabled: ${AI_PROXY_ENABLED:false}
      host: ${AI_PROXY_HOST:127.0.0.1}
      port: ${AI_PROXY_PORT:7897}

platform:
  security:
    jwt-secret: ${PLATFORM_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
