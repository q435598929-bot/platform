server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://task-server:8082; proxy_read_timeout 900s; }
  location /platform-api/ { proxy_pass http://platform-server:9090/api/; }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location / { try_files $uri $uri/ /index.html; }
}
