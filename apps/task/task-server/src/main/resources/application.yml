server:
  port: ${TASK_SERVER_PORT:8082}

spring:
  application:
    name: task-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PLATFORM_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/service_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${PLATFORM_DATASOURCE_USERNAME:root}
    password: ${PLATFORM_DATASOURCE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: task_flyway_history
    baseline-on-migrate: true
    baseline-version: 0

task:
  cors-allowed-origin: ${TASK_CORS_ALLOWED_ORIGIN:http://localhost:5176}
  upload-directory: ${TASK_UPLOAD_DIRECTORY:/workspace/input/uploads}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

platform:
  security:
    jwt-secret: ${PLATFORM_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
